[package]
name = "casita-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
bytes = "1"
libfuzzer-sys = "0.4"
tokio = { version = "1", features = ["io-util", "rt"] }
casita = { path = "../crates/casita", features = ["native", "ssh", "fuzzing"] }

[[bin]]
name = "logical_records"
path = "fuzz_targets/logical_records.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frozen_formats"
path = "fuzz_targets/frozen_formats.rs"
test = false
doc = false
bench = false

[[bin]]
name = "casitar_stream"
path = "fuzz_targets/casitar_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "git_owned_parsers"
path = "fuzz_targets/git_owned_parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "input_boundaries"
path = "fuzz_targets/input_boundaries.rs"
test = false
doc = false
bench = false
